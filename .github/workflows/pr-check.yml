# Validates Pull Request titles to ensure they follow Conventional Commits specification.
# Example: feat(cielo): add deeplink intent builder

name: PR Check

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize

permissions:
  pull-requests: read

jobs:
  validate-pr-title:
    name: PR Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate PR Title
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            chore
            ci
            build
            revert
          requireScope: true
          subjectPattern: ^(?=.{1,72}$)[a-z](?:.*[^.])?$
          subjectPatternError: |
            ❌ PR title format validation failed!

            The subject "{subject}" found in PR title "{title}" didn't match the pattern.

            Requirements:
            - Format: type(scope): subject
            - Subject must start with a lowercase letter
            - No period at the end
            - Max 72 characters

            Example: feat(cielo): add deeplink intent builder
          validateSingleCommit: false
          ignoreLabels: |
            skip-title-check
